<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finny — Better Money, Brighter Tomorrow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="css/global.css" />
  
  <!-- Immediate client-side routing to default landing page -->
  <script>
    // Redirect to the default transactions workspace inside /html/
    window.location.replace("html/transactions.html");
  </script>
</head>
<body>

  <!-- Global Navigation Header -->
  <header class="finny-nav">
    <div class="nav-left">
      <div class="brand-logo">
        <span class="logo-box">FF</span>
        <div class="brand-text">
          <span class="brand-name">Finny</span>
          <span class="brand-tagline">Better Money, Brighter Tomorrow</span>
        </div>
      </div>
      <nav class="nav-links">
        <a href="dashboard.html" class="nav-item">Dashboard</a>
        <a href="accounts.html" class="nav-item">Accounts</a>
        <a href="transactions.html" class="nav-item">Transactions</a>
        <a href="import.html" class="nav-item">Import</a>
        <a href="reconcile.html" class="nav-item">Reconcile</a>
        <a href="budget.html" class="nav-item">Budget</a>
        <a href="loans.html" class="nav-item">Loans</a>
        <a href="planner.html" class="nav-item">Planner</a>
        <a href="settings.html" class="nav-item">Settings</a>
      </nav>
    </div>
    <div class="nav-right">
      <button class="icon-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme">🌙</button>
      <div class="user-avatar" title="Dinesh Reddy">DR</div>
    </div>
  </header>

  <!-- Fallback Shell while redirecting -->
  <main class="finny-shell" style="text-align: center; padding: 80px 20px;">
    <h2 style="font-size: 20px; font-weight: 600;">Loading Finny...</h2>
    <p style="color: var(--text-muted); font-size: 13px; margin-top: 6px;">
      Redirecting to <a href="html/transactions.html" style="color: var(--finny-primary); text-decoration: none; font-weight: 600;">Transactions</a>
    </p>
  </main>

  <!-- Unified Transaction Modal -->
<div id="txnModalOverlay" class="txn-modal-overlay" style="display: none;">
  <div class="txn-modal-card">
    <div class="txn-modal-header">
      <h3 id="txnModalTitle" style="margin: 0; font-size: 1.1rem; font-weight: 600;">Add Transaction</h3>
      <button type="button" class="txn-modal-close" onclick="closeTxnModal()">✕</button>
    </div>

    <form id="txnForm" onsubmit="handleTxnSubmit(event)">
      <!-- Hidden ID trackers -->
      <input type="hidden" id="modalTxnId" value="">
      <input type="hidden" id="modalTransferPairId" value="">

      <!-- Type Segmented Switcher -->
      <div class="txn-type-switch">
        <button type="button" class="txn-type-btn active" data-type="Expense" onclick="setTxnType('Expense')">Expense</button>
        <button type="button" class="txn-type-btn" data-type="Income" onclick="setTxnType('Income')">Income</button>
        <button type="button" class="txn-type-btn" data-type="Transfer" onclick="setTxnType('Transfer')">Transfer</button>
      </div>

      <!-- Amount Input -->
      <div class="txn-form-group">
        <label for="modalAmount" class="txn-label">Amount (₹) *</label>
        <input type="number" step="0.01" min="0.01" id="modalAmount" class="txn-input txn-amount-input" placeholder="0.00" required>
      </div>

      <!-- Dynamic Accounts & Category Grid -->
      <div class="txn-grid-2">
        <!-- Expense / Income: Single Account Selection -->
        <div class="txn-form-group" id="groupSingleAccount">
          <label for="modalAccountId" class="txn-label">Account *</label>
          <select id="modalAccountId" class="txn-select"></select>
        </div>

        <!-- Expense / Income: Category Selection -->
        <div class="txn-form-group" id="groupCategory">
          <label for="modalCategoryId" class="txn-label">Category</label>
          <select id="modalCategoryId" class="txn-select"></select>
        </div>

        <!-- Transfer Mode: Source Account -->
        <div class="txn-form-group" id="groupFromAccount" style="display: none;">
          <label for="modalFromAccountId" class="txn-label">From Account *</label>
          <select id="modalFromAccountId" class="txn-select"></select>
        </div>

        <!-- Transfer Mode: Destination Account -->
        <div class="txn-form-group" id="groupToAccount" style="display: none;">
          <label for="modalToAccountId" class="txn-label">To Account *</label>
          <select id="modalToAccountId" class="txn-select"></select>
        </div>
      </div>

      <!-- Date & Time Grid -->
      <div class="txn-grid-2">
        <div class="txn-form-group">
          <label for="modalDate" class="txn-label">Date *</label>
          <input type="date" id="modalDate" class="txn-input" required>
        </div>
        <div class="txn-form-group">
          <label for="modalTime" class="txn-label">Time</label>
          <input type="time" step="1" id="modalTime" class="txn-input">
        </div>
      </div>

      <!-- Title / Payee -->
      <div class="txn-form-group">
        <label for="modalTitleInput" class="txn-label">Title / Payee *</label>
        <input type="text" id="modalTitleInput" class="txn-input" placeholder="e.g. Grocery, Salary, Dining Out" required>
      </div>

      <!-- Notes / Remarks -->
      <div class="txn-form-group">
        <label for="modalNotes" class="txn-label">Notes / Remarks</label>
        <textarea id="modalNotes" class="txn-textarea" rows="2" placeholder="Optional transaction details or split notes..."></textarea>
      </div>

      <!-- Modal Footer -->
      <div class="txn-modal-footer">
        <button type="button" id="btnDeleteTxn" class="txn-btn-danger" style="display: none;" onclick="deleteCurrentTxn()">Delete</button>
        <div style="flex: 1;"></div>
        <button type="button" class="txn-btn-secondary" onclick="closeTxnModal()">Cancel</button>
        <button type="submit" id="btnSaveTxn" class="txn-btn-primary">Save Transaction</button>
      </div>
    </form>
  </div>
</div>
  
  
  <!-- Global Scripts -->
  <script src="js/common.js"></script>
<script src="transactionModal.js?v=3.0"></script>
<script src="transactions.js?v=3.0"></script>


</body>
</html>
